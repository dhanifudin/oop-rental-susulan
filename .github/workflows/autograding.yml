name: Autograding Tests

on:
  push:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bagian 1 Main Output Test
        id: test-p01mainoutputtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 1 Main Output Test
          command: mvn -q test -Dtest=P01MainOutputTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 2 Brand Test
        id: test-p02brandtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 2 Brand Test
          command: mvn -q test -Dtest=P02BrandTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 2 Laptop Test
        id: test-p02laptoptest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 2 Laptop Test
          command: mvn -q test -Dtest=P02LaptopTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 3 Encapsulation Test
        id: test-p03encapsulationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 3 Encapsulation Test
          command: mvn -q test -Dtest=P03EncapsulationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 3 Borrower Test
        id: test-p03borrowertest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 3 Borrower Test
          command: mvn -q test -Dtest=P03BorrowerTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 4 Association Test
        id: test-p04associationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Association Test
          command: mvn -q test -Dtest=P04AssociationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 4 Rack Aggregation Test
        id: test-p04rackaggregationtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Rack Aggregation Test
          command: mvn -q test -Dtest=P04RackAggregationTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 4 Composition Test
        id: test-p04rentalcardcompositiontest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Composition Test
          command: mvn -q test -Dtest=P04RentalCardCompositionTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 4 Dependency Test
        id: test-p04techniciandependencytest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 4 Dependency Test
          command: mvn -q test -Dtest=P04TechnicianDependencyTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 5 Inheritance Test
        id: test-p06inheritancetest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 5 Inheritance Test
          command: mvn -q test -Dtest=P06InheritanceTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 6 Overriding Test
        id: test-p07overridetest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 6 Overriding Test
          command: mvn -q test -Dtest=P07OverrideTest -DfailIfNoTests=true
          timeout: 10
          max-score: 10

      - name: Bagian 6 Overloading Test
        id: test-p07overloadtest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 6 Overloading Test
          command: mvn -q test -Dtest=P07OverloadTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 7 LabRental Test
        id: test-p08labrentaltest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 7 LabRental Test
          command: mvn -q test -Dtest=P08LabRentalTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Bagian 7 Console App Test
        id: test-p08labrentalapptest
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bagian 7 Console App Test
          command: mvn -q test -Dtest=P08LabRentalAppTest -DfailIfNoTests=true
          timeout: 10
          max-score: 5

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TEST-P01MAINOUTPUTTEST_RESULTS: "${{ steps.test-p01mainoutputtest.outputs.result }}"
          TEST-P02BRANDTEST_RESULTS: "${{ steps.test-p02brandtest.outputs.result }}"
          TEST-P02LAPTOPTEST_RESULTS: "${{ steps.test-p02laptoptest.outputs.result }}"
          TEST-P03ENCAPSULATIONTEST_RESULTS: "${{ steps.test-p03encapsulationtest.outputs.result }}"
          TEST-P03BORROWERTEST_RESULTS: "${{ steps.test-p03borrowertest.outputs.result }}"
          TEST-P04ASSOCIATIONTEST_RESULTS: "${{ steps.test-p04associationtest.outputs.result }}"
          TEST-P04RACKAGGREGATIONTEST_RESULTS: "${{ steps.test-p04rackaggregationtest.outputs.result }}"
          TEST-P04RENTALCARDCOMPOSITIONTEST_RESULTS: "${{ steps.test-p04rentalcardcompositiontest.outputs.result }}"
          TEST-P04TECHNICIANDEPENDENCYTEST_RESULTS: "${{ steps.test-p04techniciandependencytest.outputs.result }}"
          TEST-P06INHERITANCETEST_RESULTS: "${{ steps.test-p06inheritancetest.outputs.result }}"
          TEST-P07OVERRIDETEST_RESULTS: "${{ steps.test-p07overridetest.outputs.result }}"
          TEST-P07OVERLOADTEST_RESULTS: "${{ steps.test-p07overloadtest.outputs.result }}"
          TEST-P08LABRENTALTEST_RESULTS: "${{ steps.test-p08labrentaltest.outputs.result }}"
          TEST-P08LABRENTALAPPTEST_RESULTS: "${{ steps.test-p08labrentalapptest.outputs.result }}"
        with:
          runners: test-p01mainoutputtest,test-p02brandtest,test-p02laptoptest,test-p03encapsulationtest,test-p03borrowertest,test-p04associationtest,test-p04rackaggregationtest,test-p04rentalcardcompositiontest,test-p04techniciandependencytest,test-p06inheritancetest,test-p07overridetest,test-p07overloadtest,test-p08labrentaltest,test-p08labrentalapptest
